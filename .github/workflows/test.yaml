name: test

on:
  push:

jobs:
  integration-test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: master
    - run: |
        flutter --version
        cd ${{ env.FLUTTER_ROOT }}
        curl -L https://github.com/nilsreichardt/flutter/commit/cb68d61677663eb88516766304f163b872e9a4df.patch | git apply
        git status
    - name: Run Integration Test
      working-directory: integration_test_timeout 
      run: flutter test integration_test -d macos
